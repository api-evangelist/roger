aid: roger
name: Roger
description: >-
  Roger (operated by Sanos Services GmbH, Berlin, Germany) is a B2B SaaS
  practice-management platform for dental clinics. It layers automation and AI
  onto existing German dental practice-management systems (PVS) such as CGM Z1,
  Charly, Dampsoft, Evident and Dento Office, adding patient recall, digital
  intake forms, WhatsApp/SMS communication, AI-assisted documentation with
  billing-position capture, digital treatment-plan signing, factoring with
  default protection and instant payout, and outsourced ZMV/reception staffing.
  The product is DSGVO/GDPR-compliant and hosted in Germany. As surfaced in the
  API Evangelist network via VC-portfolio discovery, Roger publishes a marketing
  and product site but no public developer portal, API documentation, or
  machine-readable API surface at this time.
